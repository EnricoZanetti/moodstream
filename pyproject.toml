[project]
name = "moodstream"
version = "3.0.2"
description = "Real-time webcam emotion detection with a full IoT pipeline (MQTT, Node-Red, InfluxDB, Grafana)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
    "tensorflow>=2.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
notebooks = [
    "matplotlib>=3.9.0",
    "pillow>=10.0.0",
    "jupyter>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["firmware/"]       # MicroPython - not standard Python

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
