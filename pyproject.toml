[project]
name = "embedded-emotionnn"
version = "1.0.0"
description = "Real-time emotion detection on the OpenMV Cam H7 Plus with a full IoT pipeline"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
notebooks = [
    "matplotlib>=3.9.0",
    "pillow>=10.0.0",
    "jupyter>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["firmware/"]       # MicroPython — not standard Python

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
